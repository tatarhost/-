<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER Messenger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <div class="logo">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#007bff" stroke-width="2"/>
                <path d="M50 20 L80 80 L20 80 Z" fill="none" stroke="#007bff" stroke-width="2"/>
                <circle cx="50" cy="50" r="5" fill="#007bff"/>
            </svg>
            <h2>AETHER</h2>
        </div>
        <div id="login-form" class="auth-form">
            <input type="text" id="login-nickname" placeholder="Никнейм">
            <input type="password" id="login-password" placeholder="Пароль">
            <button onclick="handleLogin()">Войти</button>
            <p class="auth-toggle">Нет аккаунта? <span onclick="toggleAuth()">Зарегистрироваться</span></p>
        </div>
        <div id="register-form" class="auth-form" style="display: none;">
            <input type="text" id="reg-nickname" placeholder="Придумайте никнейм">
            <input type="password" id="reg-password" placeholder="Пароль">
            <button onclick="handleRegister()">Создать аккаунт</button>
            <p class="auth-toggle">Уже есть аккаунт? <span onclick="toggleAuth()">Войти</span></p>
        </div>
    </div>
</div>

<aside id="sidebar">
    <div class="sidebar-header">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#007bff" stroke-width="2"/>
            <path d="M50 20 L80 80 L20 80 Z" fill="none" stroke="#007bff" stroke-width="2"/>
            <circle cx="50" cy="50" r="5" fill="#007bff"/>
        </svg>
        <span class="app-name">AETHER</span>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item active" onclick="switchTab('chats')">Чаты</div>
        <div class="nav-item" onclick="switchTab('channels')">Каналы</div>
        <div class="nav-item" onclick="switchTab('bots')">Боты</div>
        <div class="nav-item" onclick="switchTab('browser')">Браузер</div>
        <div class="nav-item" onclick="switchTab('ai')">AI Агент</div>
    </nav>
</aside>

<main>
    <header class="chat-header">
        <div id="chat-title">Выберите чат</div>
        <div class="header-actions">
            <button id="call-btn" onclick="startCall()">📞</button>
        </div>
    </header>

    <div id="chat-messages">
        <!-- Сообщения будут здесь -->
    </div>

    <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="messaging.js"></script>
<script type="module" src="social.js"></script>
<script type="module" src="bots.js"></script>
<script type="module" src="router.js"></script>
<script type="module" src="ai-agent.js"></script>
<script type="module" src="calls.js"></script>
<script type="module" src="app.js"></script>

<script>
    function toggleAuth() {
        const loginForm = document.getElementById('login-form');
        const regForm = document.getElementById('register-form');
        if (loginForm.style.display === 'none') {
            loginForm.style.display = 'flex';
            regForm.style.display = 'none';
        } else {
            loginForm.style.display = 'none';
            regForm.style.display = 'flex';
        }
    }
</script>

</body>
</html>
